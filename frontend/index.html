<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接口与登录演示</title>
  <style>
    body { margin: 0; padding: 48px 20px; font-family: system-ui, sans-serif; color: #172033; background: #f5f7fa; }
    main { max-width: 560px; margin: auto; padding: 28px; background: white; border: 1px solid #dde3eb; border-radius: 12px; }
    section + section { margin-top: 32px; padding-top: 24px; border-top: 1px solid #dde3eb; }
    h2 { margin-top: 0; font-size: 22px; }
    form { display: grid; gap: 12px; margin-bottom: 16px; }
    label { display: grid; gap: 6px; }
    input { box-sizing: border-box; width: 100%; min-width: 0; padding: 10px; border: 1px solid #aab5c5; border-radius: 6px; font: inherit; }
    form button { justify-self: start; }
    h1 { margin-top: 0; font-size: 26px; }
    p { line-height: 1.6; }
    button { padding: 10px 18px; border: 0; border-radius: 6px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    pre { padding: 16px; background: #f1f5f9; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <section aria-labelledby="hello-title">
    <h1 id="hello-title">Hello 接口演示</h1>
    <p>点击按钮，请求后端 <code>GET /hello</code>。</p>
    <button id="request" type="button">请求 /hello</button>
    <pre id="result" role="status" aria-live="polite">等待请求…</pre>
    </section>
    <section aria-labelledby="login-title">
      <h2 id="login-title">登录与用户信息</h2>
      <form id="login-form">
        <label for="account">账号
          <input id="account" name="account" autocomplete="username" required>
        </label>
        <label for="password">密码
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="login-button" type="submit">登录</button>
      </form>
      <pre id="login-result" role="status" aria-live="polite">尚未提交登录</pre>
      <button id="profile-button" type="button">获取用户信息</button>
      <pre id="profile-result" role="status" aria-live="polite">登录后可获取用户信息</pre>
    </section>
  </main>
  <script type="module">
    const button = document.querySelector('#request');
    const result = document.querySelector('#result');

    button.addEventListener('click', async () => {
      button.disabled = true;
      result.textContent = '请求中…';
      try {
        const response = await fetch('/hello', { credentials: 'same-origin' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = `请求失败：${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
    const loginForm = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const loginResult = document.querySelector('#login-result');
    const profileButton = document.querySelector('#profile-button');
    const profileResult = document.querySelector('#profile-result');

    async function post(path, body) {
      const response = await fetch(path, {
        method: 'POST',
        credentials: 'same-origin',
        ...(body ? {
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        } : {}),
      });
      const text = await response.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch {
        data = text;
      }
      if (!response.ok) {
        const message = data && typeof data === 'object' ? data.error : data;
        throw new Error(message || `HTTP ${response.status}，请确认已登录且后端运行正常`);
      }
      return typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      profileButton.disabled = true;
      loginResult.textContent = '登录中…';
      profileResult.textContent = '等待登录结果…';
      try {
        loginResult.textContent = await post('/login', {
          account: loginForm.elements.account.value,
          password: loginForm.elements.password.value,
        });
        loginForm.elements.password.value = '';
        profileResult.textContent = '登录成功，点击「获取用户信息」查看';
      } catch (error) {
        loginResult.textContent = `登录失败：${error.message}`;
        profileResult.textContent = '请先成功登录后再获取用户信息';
      } finally {
        loginButton.disabled = false;
        profileButton.disabled = false;
      }
    });

    profileButton.addEventListener('click', async () => {
      profileButton.disabled = true;
      loginButton.disabled = true;
      profileResult.textContent = '获取中…';
      try {
        profileResult.textContent = await post('/profile');
      } catch (error) {
        profileResult.textContent = `获取失败：${error.message}`;
      } finally {
        profileButton.disabled = false;
        loginButton.disabled = false;
      }
    });
  </script>
</body>
</html>
